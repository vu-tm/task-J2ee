<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Tra cứu điểm thi</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<div class="container">

    <div class="card shadow">

        <div class="card-header text-center">
            <h2>TRA CỨU ĐIỂM THI</h2>
            <p class="mb-0">
                Kỳ thi tốt nghiệp phổ thông
            </p>
        </div>

        <div class="card-body">

            <div th:if="${error}"
                 class="alert alert-danger"
                 th:text="${error}">
            </div>

            <form method="post"
                  th:action="@{/search}">

                <div class="mb-3">
                    <label for="mssv"
                           class="form-label">
                        Mã số sinh viên
                    </label>

                    <input id="mssv"
                           name="mssv"
                           type="text"
                           class="form-control"
                           placeholder="Nhập MSSV"
                           th:value="${mssv}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Mã xác nhận
                    </label>

                    <div class="captcha-box">
                        <img th:src="@{'/capcha/' + ${imgName}}"
                             alt="Captcha"
                             class="captcha-image">
                    </div>

                    <input name="captcha"
                           type="text"
                           class="form-control mt-2"
                           placeholder="Nhập mã trong hình"
                           autocomplete="off"
                           required>
                </div>

                <button type="submit"
                        class="btn btn-primary w-100">
                    Tra cứu điểm
                </button>

            </form>

            <div th:if="${student}"
                 class="result mt-4">

                <h4 class="text-center mb-3">
                    KẾT QUẢ TRA CỨU
                </h4>

                <table class="table table-bordered">
                    <tr>
                        <th>MSSV</th>
                        <td th:text="${student.mssv}"></td>
                    </tr>

                    <tr>
                        <th>Họ và tên</th>
                        <td th:text="${student.hoTen}"></td>
                    </tr>

                    <tr>
                        <th>Điểm Toán</th>
                        <td th:text="${student.diemToan}"></td>
                    </tr>

                    <tr>
                        <th>Điểm Văn</th>
                        <td th:text="${student.diemVan}"></td>
                    </tr>

                    <tr>
                        <th>Điểm Anh Văn</th>
                        <td th:text="${student.diemAnhVan}"></td>
                    </tr>
                </table>

            </div>

        </div>
    </div>

</div>

</body>
</html>
